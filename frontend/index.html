<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>손영훈 | 소개</title>
  <style>
    :root {
      --bg: #ffffff;
      --card: #ffffff;
      --accent: #0284c7;
      --accent-2: #7c3aed;
      --text: #1e293b;
      --muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo",
        "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.6;
    }
    .card {
      background: var(--card);
      border: 1px solid rgba(15, 23, 42, 0.1);
      border-radius: 20px;
      padding: 40px;
      max-width: 640px;
      width: 100%;
      box-shadow: 0 12px 40px rgba(15, 23, 42, 0.08);
    }
    .avatar {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 20px;
    }
    h1 { font-size: 30px; margin-bottom: 6px; }
    .tagline {
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 4px;
    }
    .meta { color: var(--muted); font-size: 15px; margin-bottom: 24px; }
    .section { margin-top: 24px; }
    .section h2 {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent-2);
      margin-bottom: 10px;
    }
    .section ul { list-style: none; }
    .section li { padding: 4px 0; color: var(--text); }
    .section li::before { content: "▹ "; color: var(--accent); }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .cta {
      display: inline-block;
      margin-top: 32px;
      padding: 12px 22px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #0f172a;
      font-weight: 700;
      border-radius: 12px;
      transition: transform 0.15s ease;
    }
    .cta:hover { transform: translateY(-2px); text-decoration: none; }
    footer { margin-top: 28px; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar">손</div>
    <h1>손영훈</h1>
    <p class="tagline">#Salesforce #Sales #CRM #Slack</p>
    <p class="meta">IMMS 전공 · Salesforce 근무</p>

    <div class="section">
      <h2>요즘 고민거리</h2>
      <ul>
        <li>Saaspocalypse...</li>
        <li>나는 Agentic하게 일하고 있나?</li>
      </ul>
    </div>

    <div class="section">
      <h2>요즘 관심사</h2>
      <ul>
        <li>웰빙: 수면, 식단</li>
        <li>식도락: 막걸리, 사케, 와인</li>
        <li>여행: 태국 &amp; 일본</li>
      </ul>
    </div>

    <div class="section">
      <h2>링크</h2>
      <ul>
        <li>GitHub:
          <a href="https://github.com/goodyyoung-cell/CloudComputingClass" target="_blank" rel="noopener">
            goodyyoung-cell/CloudComputingClass
          </a>
        </li>
      </ul>
    </div>

    <a class="cta" href="./practice.html">프론트–백엔드 연동 실습 페이지로 이동 →</a>

    <footer>클라우드 컴퓨팅 실습 · 개인 소개 페이지</footer>
  </main>
</body>
</html>
